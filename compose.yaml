# docker-compose for relay.ochk.io
#
# Two services:
#   - strfry:  the relay binary, listens on internal :7777
#   - caddy:   TLS termination + automatic Let's Encrypt cert for
#              relay.ochk.io. Reverse-proxies to strfry over the docker network.
#
# Health endpoint: caddy serves /health by reading strfry's `nostr-stats`
# output via a small bash one-liner (see monitoring/health.ts for the
# fancier version that consumers use directly).

services:
    strfry:
        build:
            context: .
            dockerfile: Dockerfile
        image: orangecheck/relay-ochk:latest
        restart: unless-stopped
        volumes:
            - strfry-data:/data/strfry/db
            - ./policy:/data/strfry/policy:ro
            - ./monitoring:/data/strfry/monitoring:ro
        environment:
            - TZ=UTC
        healthcheck:
            test: ["CMD", "/usr/local/bin/strfry", "--config=/etc/strfry.conf", "info"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        networks:
            - relay-net

    caddy:
        image: caddy:2.8-alpine
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config
        depends_on:
            - strfry
        networks:
            - relay-net

volumes:
    strfry-data:
    caddy-data:
    caddy-config:

networks:
    relay-net:
        driver: bridge
