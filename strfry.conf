##
## strfry config — relay.ochk.io
##
## Hand-tuned for the OrangeCheck family of kinds (30078–30086).
## See README.md for the rationale and ABUSE.md for the policy.
##
## Reference: https://github.com/hoytech/strfry/blob/master/strfry.conf
##

db = "/data/strfry/db"

dbParams {
    maxreaders = 256
    # 50 GiB ceiling. At current family throughput (~100 events/day average)
    # we are ~50 years from filling this. Resize earlier if family adoption
    # spikes; LMDB tolerates online resize to a larger value.
    mapsize = 53687091200
    noReadAhead = false
}

events {
    # Maximum size of an event in bytes. The largest envelope in the family's
    # test-vector set is ~12 KiB; 128 KiB gives an order-of-magnitude headroom.
    maxEventSize = 131072

    # Don't reject by age. We accept historical envelopes from negentropy sync.
    rejectEventsOlderThanSeconds = 0

    # Don't reject future-dated. (Some swearers pre-publish.)
    rejectEventsNewerThanSeconds = 900

    # Hard kind allowlist — strfry rejects everything outside this set at the
    # ingest layer, before the policy plugin runs. The plugin (see policy/)
    # adds the d-tag prefix gate on top.
    rejectEphemeralEventsOlderThanSeconds = 60
    rejectEphemeralEventsNewerThanSeconds = 900

    ephemeralEventsLifetimeSeconds = 300

    # Tag-index limits. We only need single-letter tags for filter queries
    # (#d, #t, #p). Multi-letter tags are stored on the event but not indexed.
    maxNumTags = 64
    maxTagValSize = 1024
}

relay {
    bind = "0.0.0.0"
    port = 7777
    # Fly's Firecracker VMs cap NOFILES at 10240; strfry's default of
    # 1024000 trips the cap and exits at boot. 8192 is plenty for our
    # connection volume.
    nofiles = 8192

    realIpHeader = "x-forwarded-for"

    info {
        name = "relay.ochk.io"
        description = "OrangeCheck family relay. Kind allowlist 30078–30086 with canonical OC d-tag prefixes. See https://github.com/orangecheck/oc-relay-infra."
        pubkey = ""
        contact = "abuse@ochk.io"
        nips = [1, 2, 4, 9, 11, 12, 15, 16, 20, 22, 33, 40, 45, 50, 77]
        software = "git+https://github.com/hoytech/strfry"
        version = ""
        # Limits per NIP-11 §relay-information
        limitation {
            max_message_length = 524288
            max_subscriptions = 64
            max_filters = 8
            max_limit = 10000
            max_subid_length = 100
            max_event_tags = 100
            max_content_length = 131072
            min_pow_difficulty = 0
            auth_required = false
            payment_required = false
            restricted_writes = true
        }
        retention = []
        relay_countries = ["DE"]
        language_tags = ["en"]
        tags = ["orangecheck", "oc-pledge", "oc-stamp", "oc-agent", "oc-vote", "oc-lock", "oc-attest"]
        posting_policy = "https://github.com/orangecheck/oc-relay-infra/blob/main/ABUSE.md"
    }

    # Write policy plugin — DISABLED 2026-06-05.
    # The Deno binary copied into the image (from denoland/deno:alpine) is
    # glibc-linked, but the strfry base is musl/Alpine, so `deno` fails to run
    # ("not found" → missing glibc loader) and the plugin rejected EVERY event
    # with "internal error" — the relay stored NOTHING from 2026-05-08 until this
    # change. The built-in `allowedKinds` gate below still rejects non-family
    # kinds at the ingest layer, so the relay stays family-scoped without Deno.
    # TODO: re-add the d-tag prefix filter via a musl-native plugin (jq) and
    # re-enable. See oc-relay-infra/policy/oc-dtag-filter.ts for the logic.
    # writePolicy {
    #     plugin = "/data/strfry/policy/oc-dtag-filter.ts"
    # }

    # Hard kind allowlist — anything outside this set is rejected at the ingest
    # layer. Source of truth: workspace KINDS.md / CLAUDE.md (30078–30115 family
    # range): verbs 30078,30080–30086, OrangeOS 30087–30093, OC Chat 30110–30112.
    allowedKinds = [30078, 30080, 30081, 30082, 30083, 30084, 30085, 30086, 30087, 30088, 30089, 30090, 30091, 30092, 30093, 30110, 30111, 30112]

    maxConnsPerIp = 16

    autoCommit = true

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }
}
