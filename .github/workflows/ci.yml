name: CI

# Pre-merge sanity gate for oc-relay-infra. The repo is mostly config
# files (strfry.conf, Dockerfile, fly.toml) + one Python write-policy
# plugin. We don't have a TS / build pipeline to run; instead:
#
#   1. Validate strfry.conf parses (smoke parse via grep — strfry is
#      a C++ binary not on the runner; full parse only happens on Fly).
#   2. Run the write-policy plugin against the d-tags the shipped
#      clients emit, and oc-relay-front's tests.
#   3. Build the image and start it: the boot script rewrites an empty
#      store once, and /health answers through the front.
#
# This catches misconfiguration before deploy.

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    config:
        name: Config sanity
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            # Every commit in the history, scanned for secrets.
            - name: No secrets in the history (gitleaks 8.30.1, pinned by sha256)
              run: |
                  curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
                  echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
                  tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
                  "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-level warn

            - name: strfry.conf basic shape
              run: |
                  # No strfry binary on the runner; sanity-grep the keys
                  # that the live relay needs. If any disappear, fail.
                  grep -q '^db = ' strfry.conf
                  # strfry has NO built-in kind allowlist — the kind + d-tag
                  # gate is the writePolicy plugin (Python since 2026-06-05).
                  # Assert the plugin is wired and points at the live file.
                  grep -q 'writePolicy' strfry.conf
                  grep -q 'oc-dtag-filter.py' strfry.conf
                  # strfry stores its source with each event. It must read the
                  # front's pseudonym and nothing else, and only the front may
                  # reach it.
                  test "$(grep -cE '^[^#]*realIpHeader' strfry.conf)" = 1
                  grep -qE '^[[:space:]]*realIpHeader = "x-oc-source"$' strfry.conf
                  grep -qE '^[[:space:]]*bind = "127\.0\.0\.1"$' strfry.conf
                  echo "strfry.conf shape ok"

            - name: write-policy plugin compiles
              run: |
                  # The active gate is the Python plugin; validate it parses.
                  python3 -m py_compile policy/oc-dtag-filter.py
                  echo "oc-dtag-filter.py compiles"

            - name: write-policy accepts what the clients emit
              run: |
                  # Compiling is not enough. The plugin rejected every OC Vote
                  # and OC Attest event for months while compiling perfectly:
                  # its prefix table was copied from a KINDS.md that had drifted
                  # from the specs. This asserts the gate against the literal
                  # d-tags the shipped publishers build.
                  python3 policy/test_policy.py

            - name: fly.toml basic shape
              run: |
                  grep -q '^app = "oc-relay-ochk"' fly.toml
                  grep -q 'primary_region = "fra"' fly.toml
                  grep -q 'mounts' fly.toml
                  echo "fly.toml shape ok"

            - name: Verify required files present
              run: |
                  test -f Dockerfile
                  test -f BYPASS.md
                  test -f ABUSE.md
                  test -f LICENSE
                  test -f policy/oc-dtag-filter.py
                  test -f policy/test_policy.py
                  test -f sync/backfill.sh
                  test -f front/main.go
                  test -f boot/oc-relay-boot.sh
                  echo "all required files present"

    front:
        name: oc-relay-front tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-go@v5
              with:
                  go-version: '1.27.2'
                  cache: false

            - name: vet and test
              working-directory: front
              run: |
                  test -z "$(gofmt -l .)"
                  go vet ./...
                  go test -race -count=1 ./...

    docker:
        name: Docker build (no push)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: docker/setup-buildx-action@v3

            - name: Build (validate only)
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: false
                  load: true
                  tags: oc-relay-infra:ci

            - name: The image starts, rewrites an empty store once, and answers through the front
              run: |
                  mkdir -p "$RUNNER_TEMP/db"
                  docker run -d --name relay -v "$RUNNER_TEMP/db:/data/strfry/db" -p 127.0.0.1:17777:7777 oc-relay-infra:ci
                  for i in $(seq 1 30); do curl -sf http://127.0.0.1:17777/health > /dev/null && break; sleep 1; done
                  curl -sf http://127.0.0.1:17777/health | grep -q '"ok":true'
                  curl -sf -H 'Accept: application/nostr+json' http://127.0.0.1:17777/ | grep -q '"name":"relay.ochk.io"'
                  docker logs relay 2>&1 | grep -q 'oc-relay-boot: rewrote the store: 0 events'
                  test -e "$RUNNER_TEMP/db/.sources-cleared-1"
                  docker logs relay 2>&1 | tail -20
